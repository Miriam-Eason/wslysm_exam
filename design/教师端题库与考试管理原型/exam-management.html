<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:,">
<title>考试管理 · 课程导航版</title>
<link rel="stylesheet" href="./assets/base.css">
<link rel="stylesheet" href="./assets/b2.css">
<link rel="stylesheet" href="./assets/exam.css">
</head>
<body>
<div class="app-shell">
  <div class="nav-scrim" id="navScrim"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="./assets/school-logo.png" alt="无锡旅游商贸助考宝">
      <button class="drawer-close" id="navClose" type="button" aria-label="关闭导航"><span data-icon="x"></span></button>
    </div>
    <nav class="side-nav" aria-label="教师导航">
      <a class="side-link" href="#" data-demo-link><span data-icon="grid"></span>仪表盘</a>
      <a class="side-link" href="#" data-demo-link><span data-icon="users"></span>班级管理</a>
      <a class="side-link" href="./dir-2-v2.html"><span data-icon="book"></span>题库管理</a>
      <a class="side-link active" href="./exam-management.html"><span data-icon="file"></span>考试管理</a>
    </nav>
    <div class="side-footer">
      <div class="user-row">
        <div class="avatar">陈</div>
        <div>
          <div class="user-name">陈瑜</div>
          <div class="user-role">酒店管理系 · 教师</div>
        </div>
      </div>
      <button class="side-action" type="button" data-toast="演示中不处理密码修改">修改密码</button>
      <button class="side-action signout" type="button" data-toast="演示中不执行退出登录">退出登录</button>
    </div>
  </aside>

  <main class="workspace">
    <div class="workspace-inner exam-page">
      <header class="mobile-head">
        <button class="nav-button" id="navOpen" type="button" aria-label="打开导航" aria-expanded="false" aria-controls="sidebar"><span data-icon="menu"></span></button>
        <img class="mobile-logo" src="./assets/school-logo.png" alt="无锡旅游商贸助考宝">
        <button class="mobile-avatar" type="button" data-toast="陈瑜 · 酒店管理系教师" aria-label="当前账号：陈瑜">陈</button>
      </header>

      <header class="page-head">
        <div class="title-line">
          <h1>考试管理</h1>
          <span class="count-label"><span id="activeCount">156</span> 个进行中<span class="count-secondary"> · <span id="archivedCount">13</span> 个已下架</span></span>
          <span class="demo-tag">方案 B · 考试延伸</span>
        </div>
        <div class="page-actions">
          <a class="button primary" id="newExamButton" href="./exam-create.html" aria-label="新建考试/练习"><span data-icon="plus"></span><span class="new-label">新建考试/练习</span></a>
        </div>
      </header>

      <div class="status-tabs-mobile" id="statusTabsMobile" aria-label="考试状态"></div>

      <section aria-label="考试筛选">
        <div class="exam-search-toolbar">
          <label class="search-box" id="searchBox">
            <span class="search-icon" data-icon="search"></span>
            <span class="sr-only">搜索考试</span>
            <input id="searchInput" type="search" autocomplete="off" placeholder="搜索考试名称、班级或科目">
            <span class="search-hint" aria-hidden="true">/</span>
            <button class="search-clear" id="searchClear" type="button" aria-label="清除搜索"><span data-icon="x"></span></button>
          </label>
          <button class="control-button" type="button" data-menu="sort" aria-haspopup="listbox" aria-expanded="false">
            <span data-icon="sort"></span>
            <span class="control-label" data-sort-label>最近创建</span>
            <span class="control-chevron" data-icon="chevronDown"></span>
          </button>
        </div>
        <div class="exam-filter-row">
          <button class="control-button mobile-filter-trigger" type="button" data-menu="class" aria-haspopup="listbox" aria-expanded="false">
            <span class="control-label" data-class-label>全部班级</span>
            <span class="control-chevron" data-icon="chevronDown"></span>
          </button>
          <button class="control-button mobile-filter-trigger" type="button" data-menu="subject" aria-haspopup="listbox" aria-expanded="false">
            <span class="control-dot" data-subject-dot></span>
            <span class="control-label" data-subject-label>全部科目</span>
            <span class="control-chevron" data-icon="chevronDown"></span>
          </button>
          <button class="control-button mobile-filter-trigger" type="button" data-menu="type" aria-haspopup="listbox" aria-expanded="false">
            <span class="control-label" data-type-label>全部类型</span>
            <span class="control-chevron" data-icon="chevronDown"></span>
          </button>
        </div>
      </section>

      <div class="exam-layout">
        <aside class="exam-facets" id="examFacets" aria-label="按状态、班级和科目筛选"></aside>

        <section class="exam-result-panel" aria-live="polite">
          <div class="exam-result-head">
            <div class="exam-result-title"><span id="resultTitle">全部考试/练习</span><small id="resultCount">68 个</small></div>
            <div class="filter-summary" id="filterSummary"></div>
          </div>
          <div class="exam-list" id="examList"></div>
          <div class="empty-state exam-empty" id="emptyState" hidden>
            <div class="empty-icon"><span data-icon="search"></span></div>
            <div class="empty-title">当前条件下没有考试或练习</div>
            <button class="button outline small" type="button" data-clear-filters>清除筛选</button>
          </div>
          <div class="pagination exam-pagination" id="pagination">
            <div class="page-summary" id="pageSummary"></div>
            <div class="pager" id="pager" aria-label="分页"></div>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>

<div class="command-scrim" id="commandScrim"></div>
<div class="command-popover" id="commandPopover" role="listbox"></div>

<div class="exam-more-menu menu-popover" id="examMoreMenu" role="menu">
  <button class="menu-item" type="button" data-exam-more="open"><span data-icon="file"></span>查看试卷</button>
  <button class="menu-item" type="button" data-exam-more="copy"><span data-icon="share"></span>复制考试</button>
  <div class="menu-separator"></div>
  <button class="menu-item danger" type="button" data-exam-more="delete"><span data-icon="trash"></span>删除考试</button>
</div>

<div class="toast-region" id="toastRegion" aria-live="polite"></div>

<script src="./assets/demo-data.js"></script>
<script src="./assets/exam-data.js"></script>
<script src="./assets/exam.js"></script>
</body>
</html>
