<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>系统维护中 - 助考宝</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7f8; color: #17323d; }
      main { width: min(90vw, 480px); padding: 32px 0; }
      .rule { width: 48px; height: 4px; background: #15977e; margin-bottom: 28px; }
      h1 { font-size: 28px; line-height: 1.3; margin: 0 0 14px; }
      p { color: #52656d; font-size: 16px; line-height: 1.8; margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <div class="rule" aria-hidden="true"></div>
      <h1>系统维护中</h1>
      <p>助考宝正在更新，请稍后再访问。维护期间暂时无法登录、作答或提交试卷。</p>
    </main>
  </body>
</html>
